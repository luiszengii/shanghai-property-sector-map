name: Deploy pre-production to Tencent Cloud Seoul

on:
  push:
    branches:
      - pre-prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shfang-pre-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.1"
  PNPM_VERSION: "11.9.0"
  DEPLOY_HOST: "43.155.217.8"
  DEPLOY_USER: "deploy"
  DEPLOY_ROOT: "/opt/shfang-preprod"
  SERVICE_NAME: "shfang-preprod.service"
  HEALTH_HOST: "pre-prod.shfang.xyz"
  HEALTH_URL: "http://127.0.0.1:3001"
  PREPROD_URL: "https://pre-prod.shfang.xyz"

jobs:
  build-and-deploy:
    name: Build, verify and deploy pre-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pre-production
      url: https://pre-prod.shfang.xyz

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:map-performance
          pnpm check:public

      - name: Build standalone application
        env:
          NEXT_PUBLIC_AMAP_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_KEY }}
          NEXT_PUBLIC_AMAP_SECURITY_JS_CODE: ${{ secrets.NEXT_PUBLIC_AMAP_SECURITY_JS_CODE }}
        run: pnpm build

      - name: Verify public client artifact
        run: |
          pnpm check:public --artifact .next/static
          pnpm check:public --artifact .next/standalone

      - name: Package release
        run: |
          release_root="${RUNNER_TEMP}/release"
          mkdir -p "${release_root}/.next"
          cp -a .next/standalone/. "${release_root}/"
          cp -a .next/static "${release_root}/.next/static"
          cp -a public "${release_root}/public"
          rm -rf -- "${release_root}/outputs"
          install -m 0755 scripts/activate-release.sh "${release_root}/activate-release.sh"
          tar -C "${release_root}" -czf "${RUNNER_TEMP}/${GITHUB_SHA}.tar.gz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 0600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0644 "${HOME}/.ssh/known_hosts"

      - name: Upload release
        run: |
          scp -o BatchMode=yes \
            "${RUNNER_TEMP}/${GITHUB_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_ROOT}/incoming/${GITHUB_SHA}.tar.gz"

      - name: Activate release
        run: |
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -Eeuo pipefail; \
             release_dir='${DEPLOY_ROOT}/releases/${GITHUB_SHA}'; \
             if [[ ! -d \"\${release_dir}\" ]]; then \
               staging_dir=\"\${release_dir}.staging\"; \
               rm -rf -- \"\${staging_dir}\"; \
               mkdir -p \"\${staging_dir}\"; \
               tar -xzf '${DEPLOY_ROOT}/incoming/${GITHUB_SHA}.tar.gz' -C \"\${staging_dir}\"; \
               mv \"\${staging_dir}\" \"\${release_dir}\"; \
             fi; \
             rm -f '${DEPLOY_ROOT}/incoming/${GITHUB_SHA}.tar.gz'; \
             SHFANG_DEPLOY_ROOT='${DEPLOY_ROOT}' \
             SHFANG_SERVICE_NAME='${SERVICE_NAME}' \
             SHFANG_HEALTH_HOST='${HEALTH_HOST}' \
             SHFANG_HEALTH_URL='${HEALTH_URL}' \
             \"\${release_dir}/activate-release.sh\" '${GITHUB_SHA}'"

      - name: Verify pre-production endpoint
        env:
          PREPROD_BASIC_AUTH: ${{ secrets.PREPROD_BASIC_AUTH }}
        run: |
          test -n "${PREPROD_BASIC_AUTH}"
          curl --fail --silent --show-error --location \
            --user "${PREPROD_BASIC_AUTH}" \
            --output /dev/null \
            "${PREPROD_URL}/"
          curl --fail --silent --show-error --location \
            --user "${PREPROD_BASIC_AUTH}" \
            --output /dev/null \
            "${PREPROD_URL}/observations"
